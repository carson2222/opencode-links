<!doctype html>
<!-- README banner. Open with ?mode=dark|light&size=banner|social, screenshot #banner at 2x into assets/. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Geist Serif"; src: url(https://cdn.jsdelivr.net/npm/geist@1.9.2/dist/fonts/geist-serif/GeistSerif-Regular.woff2); }
  @font-face { font-family: "Geist Mono"; src: url(https://cdn.jsdelivr.net/npm/geist@1.9.2/dist/fonts/geist-mono/GeistMono-Regular.woff2); }
  :root { --page: #0d1117; --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --line: #27272a; --dot: 124, 92, 255; --chip: #18181b; --pr: #3fb950; --lin: #f2c94c; --loc: #56b6c2; }
  .light { --page: #ffffff; --bg: #ffffff; --fg: #09090b; --muted: #52525b; --line: #e4e4e7; --dot: 109, 76, 240; --chip: #f4f4f5; --pr: #1a7f37; --lin: #b08800; --loc: #0e7490; }
  html, body { margin: 0; }
  body { background: var(--page); }
  #banner { position: relative; width: 1280px; height: 400px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-sizing: border-box; font-family: "Geist Mono", monospace; color: var(--fg); }
  .social #banner { height: 640px; border: 0; border-radius: 0; }
  canvas { position: absolute; inset: 0; }
  .content { position: absolute; left: 88px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .mark { width: 56px; height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--chip); display: grid; place-items: center; }
  .mark svg { width: 28px; height: 28px; }
  h1 { margin: 0; font: 400 100px/0.95 "Geist Serif", serif; letter-spacing: -0.03em; }
  p { margin: 0; font-size: 21px; color: var(--muted); }
  .chips { display: flex; gap: 10px; margin-top: 6px; }
  .chip { display: flex; align-items: center; gap: 9px; padding: 8px 14px 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--chip); font-size: 17px; }
  .chip svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="banner">
  <canvas id="dither"></canvas>
  <div class="content">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg></div>
    <h1>opencode-links</h1>
    <p>Every PR, Linear issue and local page your chat produced.</p>
    <div class="chips">
      <span class="chip"><svg style="color: var(--pr)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><line x1="6" x2="6" y1="9" y2="21"/></svg>Pull requests</span>
      <span class="chip"><svg style="color: var(--lin)" viewBox="0 0 24 24" fill="currentColor"><path d="M2.886 4.18A11.982 11.982 0 0 1 11.99 0C18.624 0 24 5.376 24 12.009c0 3.64-1.62 6.903-4.18 9.105L2.887 4.18ZM1.817 5.626l16.556 16.556c-.524.33-1.075.62-1.65.866L.951 7.277c.247-.575.537-1.126.866-1.65ZM.322 9.163l14.515 14.515c-.71.172-1.443.282-2.195.322L0 11.358a12 12 0 0 1 .322-2.195Zm-.17 4.862 9.823 9.824a12.02 12.02 0 0 1-9.824-9.824Z"/></svg>Linear issues</span>
      <span class="chip"><svg style="color: var(--loc)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>Local pages</span>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search)
  if (params.get("mode") === "light") document.body.classList.add("light")
  if (params.get("size") === "social") document.body.classList.add("social")
  const banner = document.getElementById("banner")
  const canvas = document.getElementById("dither")
  const width = banner.clientWidth
  const height = banner.clientHeight
  canvas.width = width
  canvas.height = height
  const bayer = [
    [0, 32, 8, 40, 2, 34, 10, 42], [48, 16, 56, 24, 50, 18, 58, 26], [12, 44, 4, 36, 14, 46, 6, 38], [60, 28, 52, 20, 62, 30, 54, 22],
    [3, 35, 11, 43, 1, 33, 9, 41], [51, 19, 59, 27, 49, 17, 57, 25], [15, 47, 7, 39, 13, 45, 5, 37], [63, 31, 55, 23, 61, 29, 53, 21],
  ]
  const ctx = canvas.getContext("2d")
  const rgb = getComputedStyle(document.body).getPropertyValue("--dot").trim()
  const cell = 5
  const glow = (x, y, cx, cy, rx, ry) => Math.max(0, 1 - Math.hypot((x - cx) / rx, (y - cy) / ry))
  for (let y = 0; y < height; y += cell) {
    for (let x = 0; x < width; x += cell) {
      const fade = Math.min(1, Math.max(0, (x - 760) / 360))
      const v = fade * Math.min(1, 1.15 * glow(x, y, 1120, 40, 620, 420) ** 1.6 + 0.55 * glow(x, y, 900, height + 30, 520, 260) ** 2)
      if (v > (bayer[(y / cell) % 8][(x / cell) % 8] + 0.5) / 64) {
        ctx.fillStyle = `rgba(${rgb}, ${0.35 + 0.55 * v})`
        ctx.fillRect(x, y, cell - 1, cell - 1)
      }
    }
  }
  Promise.all([...document.fonts].map((font) => font.load())).then(() => document.body.setAttribute("data-ready", "1"))
</script>
</body>
</html>
